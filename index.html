<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeDecay AI</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .landing-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .landing-tagline {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 48px;
            max-width: 600px;
        }
        .landing-actions {
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div style="color: var(--accent-blue); margin-bottom: 24px;">
            <i data-lucide="brain-circuit" style="width: 64px; height: 64px;"></i>
        </div>
        <h1 class="landing-title">KnowledgeDecay AI</h1>
        <p class="landing-tagline">"Don't study more. Remember longer."</p>
        <div class="landing-actions">
            <a href="login.html" class="btn btn-outline" style="padding: 14px 32px; font-size: 1.1rem;">Login</a>
            <a href="dashboard.html" class="btn btn-primary" style="padding: 14px 32px; font-size: 1.1rem;">View Dashboard</a>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
